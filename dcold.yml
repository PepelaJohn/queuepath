version: "3.9"

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: queuepath
      POSTGRES_USER: pepelajohn
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # pulled from .env on the VPS
    volumes:
      - postgres_data:/var/lib/postgresql/data  # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepelajohn -d queuepath"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # waits for postgres to be ready before starting
    environment:
      DATABASE_URL: postgresql://queuepath_user:${DB_PASSWORD}@db:5432/queuepath
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # ... all other env vars
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data: